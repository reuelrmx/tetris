<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>STRATA — falling block puzzle</title>
    <meta
      name="description"
      content="STRATA is a falling-block puzzle game: Marathon, Sprint, Ultra and online Versus, playable offline."
    />
    <meta name="theme-color" content="#0b0e10" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">STRATA</span>
          <span class="brand__sub" id="topbar-mode">Falling-block puzzle</span>
        </div>
        <nav class="topbar__actions" aria-label="Game actions">
          <button type="button" class="btn btn--ghost" id="btn-pause" hidden>Pause</button>
          <button type="button" class="btn btn--ghost" id="btn-sound" aria-pressed="true">
            <span class="sr-only">Sound: </span><span data-sound-label>on</span>
          </button>
          <button type="button" class="btn btn--ghost" id="btn-settings">Settings</button>
        </nav>
      </header>

      <main id="main" class="main" tabindex="-1">
        <!-- Screens are mounted here by src/ui/navigation.ts -->
        <div id="screen-root" class="screen-root"></div>
      </main>

      <footer class="statusbar" aria-label="Status">
        <span class="statusbar__item" id="status-multiplayer">Offline play ready</span>
        <span class="statusbar__item statusbar__item--dim" id="status-build"></span>
      </footer>
    </div>

    <!-- Dialogs, pause screens and toasts mount here. -->
    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <!-- Announcements for assistive tech: clears, level-ups, match events. -->
    <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <p style="padding: 2rem; font-family: monospace">
        STRATA needs JavaScript to run: the game engine, board rendering and offline support are all
        implemented in TypeScript. Nothing about your play is sent anywhere.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
